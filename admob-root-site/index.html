<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ampthill Software</title>
    <style>
        :root {
            --bg: #eef4fa;
            --card: #ffffff;
            --text: #15304d;
            --muted: #5a6b7f;
            --accent: #003a78;
            --border: #d7e1ec;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(180deg, #edf4fb 0%, #f8fbfe 100%);
            color: var(--text);
        }

        .wrap {
            max-width: 780px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 32px 24px;
            box-shadow: 0 12px 36px rgba(0, 58, 120, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 2.2rem;
            line-height: 1.1;
        }

        p, li {
            font-size: 1rem;
            line-height: 1.7;
        }

        .muted {
            color: var(--muted);
        }

        a {
            color: var(--accent);
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>Ampthill Software</h1>
        <p class="muted">App support and publisher verification links.</p>

        <p>
            This site hosts publisher verification files and public support pages
            for Ampthill Software Android apps.
        </p>

        <ul>
            <li><a href="/app-ads.txt">app-ads.txt</a></li>
            <li><a href="https://ampthillsoftware.github.io/mothistory-site/">MOT History privacy policy</a></li>
        </ul>
    </div>
</div>
</body>
</html>
